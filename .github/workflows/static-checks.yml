name: Static Checks

# 便宜的那一档：秒级、零依赖，任何改动都跑。
#   · 声明一致性 —— 文档里写的数量/日期必须能从 templates/ 和 git 推导出来（docs-only 的 PR 也查）
#   · 索引双向   —— refs/·modes/ 的 index.md 与磁盘互为充要（漏登记＝没交付，悬空登记＝AI 读空路径）
# 贵的那一档（e2e）在 test.yml；外链腐化审计在 link-rot.yml（月度 cron）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  static:
    name: 声明 + 索引一致性
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # updated 日期检查要看「最后一次改动 src/·templates/ 的提交」，浅克隆看不到
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # 两个 checker 都零依赖，不需要 npm install
      - name: Check claims
        env:
          FAIL_ON_FINDINGS: 'true'
          # updated 日期落后只告警：不想让「改了 templates 忘了改日期」把 PR 卡死。
          # 想收紧就把这里改成 'true'。
          FAIL_ON_STALE_DATE: 'false'
          OPEN_CLAIM_SLACK: '15'
        run: npm run check:claims

      # always()：上一步红了也把索引问题一次看全，不用来回推两趟
      - name: Check indexes
        if: always()
        env:
          FAIL_ON_FINDINGS: 'true'
        run: npm run check:index
