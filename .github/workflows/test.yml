name: E2E Test

# 贵的那一档：build → init --all（7 平台）→ 结构/doctor/幂等/内核/注入/卸载/profile gate 全链路。
# 用 paths 过滤，改文档不烧这几分钟。
# （两处 paths 是手工重复的——GitHub Actions 不支持 YAML anchor，改一处记得改另一处。）
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'templates/**'
      - 'tests/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'templates/**'
      - 'tests/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/test.yml'
  workflow_dispatch:

jobs:
  e2e:
    name: e2e (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Windows 是本框架的主战场（setup.cmd / install.ps1 / arch-check.ps1），与 ubuntu 同为必过门禁
      # （f3327aa 首轮即跑绿，含 symlink/pwsh/py 探测分支，故不再 continue-on-error）。
      # node 双档：20 = package.json engines 声明的下限（必须真的能跑），24 = 现役。
      # engines 改动时这里要跟着改——check:claims 只管文档与 engines 一致，管不到 matrix。
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '24']
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          # 运行时内核与注入 hook 都是 Python；3.12 与配套 MATLAB 引擎技能的上限一致
          python-version: '3.12'

      # 本仓 .gitignore 掉了 package-lock.json，所以用 install 而不是 ci
      - name: Install dev deps
        run: npm install --no-audit --no-fund

      - name: Run e2e suite
        shell: bash
        run: bash tests/test-auto-embedded.sh
